# ============================================================================
# dsh-archiver —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 装好后只要 profile 的 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile desktop add link:<插件目录>
#
# ⚠️ entry id（下面这个 `dsh-archiver`）必须等于 lib/index.js 导出的 `name`，
#    也等于插件家目录名（$DSH_HOME/dsh-archiver）。
#    三处不一致会出现「改了配置不生效」。
#
# 配置的真相源是 $DSH_HOME/dsh-archiver/config.json（由插件自己读写），
# 所以这里不写 config：避免两处默认值打架。
# ============================================================================

- insert:
    - id: dsh-archiver
      name: dsh-archiver
